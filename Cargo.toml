[package]
name = "spark-micro"
version = "0.1.0"
edition = "2024"



[dependencies]
actix-web = "4.4"
actix-cors = "0.6"
ssh2 = "0.9"
thiserror = "2"
rumqttc = "0.25"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

actix-identity = "0.9"
actix-session = { version = "0.8", features = ["redis-rs-session"]}
actix-web-httpauth = "0.8"


tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"]}
chrono =  { version="0.4", features = ["serde"] }
ipnetwork = "0.20"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "migrate", "ipnetwork"] }

# Auth & Security
argon2 = "0.5"
jsonwebtoken = "9.2"
bcrypt = "0.18"
rand = "0.5"

# Validation
validator = { version = "0.16", features = ["derive"] }

# Enviroment 
dotenv =  "0.15"
config = "0.13"

# Logging
env_logger = "0.11"

#Email (for Passwird reset) 
lettre = { version= "0.10", features = ["smtp-transport", "builder", "tokio1-native-tls"] }

async-ssh2-tokio = "0.13.0"